# Thanks to @wiedehopf for this configuration file!
services:
  globe:
    # Ultrafeeder with readsb built WITH_UUIDS (see Dockerfile). Rebuild to pick up
    # upstream updates: docker compose build --pull && docker compose up -d
    build: .
    restart: unless-stopped
    healthcheck:
      disable: true
    container_name: globe
    hostname: globe
    environment:
      - S6_KILL_GRACETIME=100
      - TZ=UTC
      - UPDATE_TAR1090=true
      - UPDATE_TAR1090_DAYS=7
      - READSB_JEMALLOC=true
      - READSB_ENABLE_API=true
      - TAR1090_ENABLE_AC_DB=True
      - TAR1090_HISTORY_DISABLE=true
      - READSB_EXTRA_ARGS=
        --tar1090-use-api --write-json-globe-index
        --json-reliable=2 --ac-hash-bits 18
        --net-receiver-id --net-ingest
      - READSB_ENABLE_TRACES=true
      #- TAR1090_USEROUTEAPI=True
      - MAX_GLOBE_HISTORY=365
      # Aggregator connections:
      - ULTRAFEEDER_CONFIG=
          adsb,feed.luftlage.net,30101,beast_reduce_plus_out;
          adsb,feed.adsbiq.com,30004,beast_reduce_plus_out;
          adsb,feed.map.flights,30004,beast_reduce_plus_out;
    ports:
      - 80:80 # change 80 to whatever port you want the webserver to listen on
      - 30004:30004 # change 30004 to whatever port you want to ingest data on
    tmpfs:
      - /run:exec,size=8192M
    volumes:
      - /opt/ultrafeeder/globe_history:/var/globe_history
      - /opt/ultrafeeder/graphs1090:/var/lib/collectd
      - /proc/diskstats:/proc/diskstats:ro
      # pfb-tiles: proxy /pfb-tiles/ to the service below (07-pfb-tiles adds it to tar1090's nginx site)
      - ./pfb-tiles:/opt/pfb-tiles:ro
      - ./pfb-tiles/07-pfb-tiles:/etc/s6-overlay/startup.d/07-pfb-tiles:ro

  # Static vector basemap tiles (OpenMapTiles schema, trimmed) for the map behind pantsforbirds.com's
  # live traffic: https://globe.whereplane.xyz/pfb-tiles/v1/{z}/{x}/{y}.pbf. See pfb-tiles/README.md.
  pfb-tiles:
    image: nginx:1.27.5-alpine
    container_name: pfb-tiles
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./pfb-tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PFB_TILES_DIR:-/home/bird/pfb-tiles-t0530/tiles}:/srv/tiles:ro
