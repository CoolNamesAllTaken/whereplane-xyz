[pytest]
DJANGO_SETTINGS_MODULE = whereplane_web.settings
python_files = test_*.py
env =
    TESTING=1
    DJANGO_SECRET_KEY=test-only-secret-key
    WHEREPLANE_FEEDERS_DIR=/tmp/whereplane-web-test/feeders
    WHEREPLANE_READSBEE_STATUS_FILE=/nonexistent/readsbee.json
filterwarnings =
    ignore:No directory at:UserWarning
