# pfb-tiles: basemap tiles from the pfb-tiles service (compose.yml).
# Resolved per request, so globe's nginx starts and serves even when that container is down.
location ^~ /pfb-tiles/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pfb_tiles_upstream http://pfb-tiles:80;
    proxy_pass $pfb_tiles_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    gzip off;
}
