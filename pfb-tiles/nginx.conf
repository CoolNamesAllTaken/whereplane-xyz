# Tiles are stored gzip-compressed: tiles/<version>/<z>/<x>/<y>.pbf
server {
    listen 80;
    server_name _;
    root /srv/tiles;
    access_log off;
    gzip off;

    location ~ ^/pfb-tiles/(v[0-9]+)/([0-9]+)/([0-9]+)/([0-9]+)\.pbf$ {
        try_files /$1/$2/$3/$4.pbf @empty;
        types { } default_type application/vnd.mapbox-vector-tile;
        add_header Content-Encoding gzip;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Outside the coverage, or nothing to draw there.
    location @empty {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=604800" always;
        return 204;
    }
    location ~ ^/pfb-tiles/(v[0-9]+)/(tiles|metadata)\.json$ {
        try_files /$1/$2.json =404;
        types { } default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        return 404;
    }
}
